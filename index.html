<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Tracker</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#38bdf8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bulk Tracker">
    <link rel="apple-touch-icon" href="./icon-192.svg">

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 1rem;
        }
        h1 {
            text-align: center;
            font-size: 1.75rem;
            margin-bottom: 0.25rem;
            color: #38bdf8;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 0.5rem 1rem;
            border: 1px solid #334155;
            background: #1e293b;
            color: #94a3b8;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .tab-btn:hover { border-color: #38bdf8; color: #e2e8f0; }
        .tab-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; font-weight: 600; }
        .tab-content { display: none; max-width: 700px; margin: 0 auto; }
        .tab-content.active { display: block; }

        /* Form */
        .form-card {
            background: #1e293b;
            border-radius: 0.75rem;
            padding: 1.5rem;
            border: 1px solid #334155;
        }
        .form-section-title {
            font-size: 1rem;
            color: #38bdf8;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width { grid-column: 1 / -1; }
        .form-group label {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }
        .form-group input[type="number"],
        .form-group input[type="date"] {
            padding: 0.5rem 0.75rem;
            border-radius: 0.4rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 0.95rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #7dd3fc; }
        .btn-secondary {
            padding: 0.5rem 1rem;
            background: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
            border-radius: 0.4rem;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-secondary:hover { background: #475569; }
        .btn-danger {
            padding: 0.35rem 0.75rem;
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 0.35rem;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .btn-danger:hover { background: #ef4444; }

        /* Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .dash-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1rem;
            text-align: center;
        }
        .dash-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #38bdf8;
        }
        .dash-card .label {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 0.25rem;
        }

        /* History */
        .history-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
        }
        .history-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .history-date { font-weight: 600; color: #38bdf8; }
        .history-measurements {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.35rem 1rem;
            font-size: 0.82rem;
            color: #94a3b8;
        }
        .history-measurements strong { color: #e2e8f0; }
        .delta-positive { color: #4ade80; font-size: 0.75rem; }
        .delta-negative { color: #f87171; font-size: 0.75rem; }
        .delta-neutral { color: #64748b; font-size: 0.75rem; }
        .history-photo { margin-top: 0.75rem; }
        .history-photo img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 0.5rem;
            border: 1px solid #334155;
        }

        /* Charts */
        .chart-container {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .chart-container canvas { max-height: 300px; }
        .chart-select {
            display: flex;
            justify-content: center;
            margin-bottom: 1rem;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .chart-select button {
            padding: 0.35rem 0.75rem;
            border: 1px solid #334155;
            background: #1e293b;
            color: #94a3b8;
            border-radius: 0.35rem;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .chart-select button.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
        .chart-select button:hover { border-color: #38bdf8; }

        /* Goals */
        .goal-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        .goal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .goal-label { font-weight: 600; font-size: 0.9rem; }
        .goal-numbers { font-size: 0.8rem; color: #94a3b8; }
        .progress-bar {
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }
        .progress-fill {
            height: 100%;
            background: #38bdf8;
            border-radius: 4px;
            transition: width 0.3s;
        }
        .progress-fill.complete { background: #4ade80; }

        /* Photos */
        .photo-input-area {
            border: 2px dashed #334155;
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }
        .photo-input-area:hover { border-color: #38bdf8; }
        .photo-input-area img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 0.4rem;
            margin-top: 0.5rem;
        }
        .photo-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.75rem;
        }
        .photo-gallery-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            overflow: hidden;
            cursor: pointer;
        }
        .photo-gallery-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .photo-gallery-item .photo-date {
            padding: 0.4rem;
            font-size: 0.7rem;
            color: #94a3b8;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            padding: 3rem 1rem;
        }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: #065f46;
            color: #a7f3d0;
            padding: 0.75rem 1.25rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show { opacity: 1; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.show { display: flex; }
        .modal-overlay img {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 0.5rem;
        }

        @media (max-width: 500px) {
            .form-grid { grid-template-columns: 1fr; }
            .history-measurements { grid-template-columns: 1fr; }
            .dashboard-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>
    <h1>💪 Bulk Tracker</h1>
    <p class="subtitle">Weekly body measurements for your muscle-building journey</p>

    <div class="tabs">
        <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
        <button class="tab-btn" data-tab="input">Log Entry</button>
        <button class="tab-btn" data-tab="history">History</button>
        <button class="tab-btn" data-tab="photos">Photos</button>
        <button class="tab-btn" data-tab="charts">Charts</button>
        <button class="tab-btn" data-tab="goals">Goals</button>
    </div>

    <!-- Dashboard -->
    <div id="tab-dashboard" class="tab-content active">
        <div class="dashboard-grid" id="dashboard-grid"></div>
    </div>

    <!-- Log Entry -->
    <div id="tab-input" class="tab-content">
        <div class="form-card">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="entry-date">Week Date</label>
                    <input type="date" id="entry-date">
                </div>
            </div>

            <p class="form-section-title">Weight</p>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="weight">Body Weight (lbs)</label>
                    <input type="number" id="weight" step="0.1" placeholder="185.5">
                </div>
            </div>

            <p class="form-section-title">Upper Body</p>
            <div class="form-grid">
                <div class="form-group">
                    <label for="neck">Neck (in)</label>
                    <input type="number" id="neck" step="0.1" placeholder="15.5">
                </div>
                <div class="form-group">
                    <label for="shoulders">Shoulders (in)</label>
                    <input type="number" id="shoulders" step="0.1" placeholder="48.0">
                </div>
                <div class="form-group">
                    <label for="chest">Chest (in)</label>
                    <input type="number" id="chest" step="0.1" placeholder="42.0">
                </div>
                <div class="form-group">
                    <label for="waist">Waist (in)</label>
                    <input type="number" id="waist" step="0.1" placeholder="33.0">
                </div>
            </div>

            <p class="form-section-title">Arms</p>
            <div class="form-grid">
                <div class="form-group">
                    <label for="bicep-left">Left Bicep (in)</label>
                    <input type="number" id="bicep-left" step="0.1" placeholder="14.5">
                </div>
                <div class="form-group">
                    <label for="bicep-right">Right Bicep (in)</label>
                    <input type="number" id="bicep-right" step="0.1" placeholder="14.5">
                </div>
            </div>

            <p class="form-section-title">Lower Body</p>
            <div class="form-grid">
                <div class="form-group">
                    <label for="hips">Hips (in)</label>
                    <input type="number" id="hips" step="0.1" placeholder="38.0">
                </div>
                <div class="form-group">
                    <label for="thigh-left">Left Thigh (in)</label>
                    <input type="number" id="thigh-left" step="0.1" placeholder="23.0">
                </div>
                <div class="form-group">
                    <label for="thigh-right">Right Thigh (in)</label>
                    <input type="number" id="thigh-right" step="0.1" placeholder="23.0">
                </div>
                <div class="form-group">
                    <label for="calf-left">Left Calf (in)</label>
                    <input type="number" id="calf-left" step="0.1" placeholder="15.0">
                </div>
                <div class="form-group">
                    <label for="calf-right">Right Calf (in)</label>
                    <input type="number" id="calf-right" step="0.1" placeholder="15.0">
                </div>
            </div>

            <p class="form-section-title">Progress Photo (optional)</p>
            <div class="photo-input-area" id="photo-input-area">
                <p style="color:#64748b;">Tap to add a photo</p>
                <input type="file" id="photo-input" accept="image/*" style="display:none;">
            </div>

            <button class="btn-primary" id="save-btn">Save Week Entry</button>
        </div>
    </div>

    <!-- History -->
    <div id="tab-history" class="tab-content">
        <div id="history-container"></div>
    </div>

    <!-- Photos -->
    <div id="tab-photos" class="tab-content">
        <div class="photo-gallery" id="photo-gallery"></div>
    </div>

    <!-- Charts -->
    <div id="tab-charts" class="tab-content">
        <div class="chart-select" id="chart-select"></div>
        <div class="chart-container">
            <canvas id="progress-chart"></canvas>
        </div>
    </div>

    <!-- Goals -->
    <div id="tab-goals" class="tab-content">
        <div class="form-card" style="margin-bottom:1rem;">
            <p class="form-section-title">Add Goal</p>
            <div class="form-grid">
                <div class="form-group">
                    <label for="goal-metric">Measurement</label>
                    <select id="goal-metric" style="padding:0.5rem;border-radius:0.4rem;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:0.95rem;">
                    </select>
                </div>
                <div class="form-group">
                    <label for="goal-target">Target Value</label>
                    <input type="number" id="goal-target" step="0.1" placeholder="200">
                </div>
            </div>
            <button class="btn-primary" id="add-goal-btn">Add Goal</button>
        </div>
        <div id="goals-container"></div>
    </div>

    <!-- Photo Modal -->
    <div class="modal-overlay" id="photo-modal">
        <img id="modal-img" src="" alt="Progress photo">
    </div>

    <div class="toast" id="toast"></div>

    <script>
    (function() {
        // ===== IndexedDB Setup =====
        const DB_NAME = 'BulkTrackerDB';
        const DB_VERSION = 2;
        const STORE_NAME = 'entries';
        const GOALS_STORE = 'goals';

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'date' });
                    }
                    if (!db.objectStoreNames.contains(GOALS_STORE)) {
                        db.createObjectStore(GOALS_STORE, { keyPath: 'id', autoIncrement: true });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function getAllEntries() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result.sort((a, b) => a.date.localeCompare(b.date)));
                req.onerror = () => reject(req.error);
            });
        }

        async function saveEntry(entry) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put(entry);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function deleteEntry(date) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.delete(date);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function getAllGoals() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(GOALS_STORE, 'readonly');
                const store = tx.objectStore(GOALS_STORE);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveGoal(goal) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(GOALS_STORE, 'readwrite');
                const store = tx.objectStore(GOALS_STORE);
                store.put(goal);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function deleteGoal(id) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(GOALS_STORE, 'readwrite');
                const store = tx.objectStore(GOALS_STORE);
                store.delete(id);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        // ===== Measurements config =====
        const MEASUREMENTS = [
            { id: 'weight', label: 'Weight', unit: 'lbs', color: '#38bdf8' },
            { id: 'neck', label: 'Neck', unit: 'in', color: '#a78bfa' },
            { id: 'shoulders', label: 'Shoulders', unit: 'in', color: '#fb923c' },
            { id: 'chest', label: 'Chest', unit: 'in', color: '#f87171' },
            { id: 'waist', label: 'Waist', unit: 'in', color: '#fbbf24' },
            { id: 'bicep-left', label: 'L Bicep', unit: 'in', color: '#34d399' },
            { id: 'bicep-right', label: 'R Bicep', unit: 'in', color: '#2dd4bf' },
            { id: 'hips', label: 'Hips', unit: 'in', color: '#e879f9' },
            { id: 'thigh-left', label: 'L Thigh', unit: 'in', color: '#60a5fa' },
            { id: 'thigh-right', label: 'R Thigh', unit: 'in', color: '#818cf8' },
            { id: 'calf-left', label: 'L Calf', unit: 'in', color: '#4ade80' },
            { id: 'calf-right', label: 'R Calf', unit: 'in', color: '#a3e635' },
        ];

        // ===== Tabs =====
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
                if (btn.dataset.tab === 'dashboard') renderDashboard();
                if (btn.dataset.tab === 'history') renderHistory();
                if (btn.dataset.tab === 'photos') renderPhotoGallery();
                if (btn.dataset.tab === 'charts') renderChart();
                if (btn.dataset.tab === 'goals') renderGoals();
                if (btn.dataset.tab === 'input') prefillLastWeek();
            });
        });

        // ===== Toast =====
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // ===== Helpers =====
        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        }

        function formatDelta(current, previous, label) {
            if (previous === undefined || current === undefined) return '';
            const diff = current - previous;
            const pct = previous !== 0 ? ((diff / previous) * 100).toFixed(1) : '0.0';
            const sign = diff >= 0 ? '+' : '';
            const arrow = diff > 0 ? '↑' : diff < 0 ? '↓' : '→';
            const cls = diff > 0 ? 'delta-positive' : diff < 0 ? 'delta-negative' : 'delta-neutral';
            return `<span class="${cls}">${arrow} ${sign}${diff.toFixed(1)} (${sign}${pct}%)</span>`;
        }

        // ===== Set default date =====
        document.getElementById('entry-date').valueAsDate = new Date();

        // ===== Prefill last week's values =====
        async function prefillLastWeek() {
            const entries = await getAllEntries();
            if (entries.length === 0) return;
            const last = entries[entries.length - 1];
            MEASUREMENTS.forEach(m => {
                const input = document.getElementById(m.id);
                if (last[m.id] !== undefined && !input.value) {
                    input.value = last[m.id];
                }
            });
        }
        prefillLastWeek();

        // ===== Photo handling =====
        let currentPhoto = null;
        const photoInputArea = document.getElementById('photo-input-area');
        const photoInput = document.getElementById('photo-input');

        photoInputArea.addEventListener('click', () => photoInput.click());
        photoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                // Resize image to save storage
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxW = 800;
                    const scale = Math.min(1, maxW / img.width);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    currentPhoto = canvas.toDataURL('image/jpeg', 0.7);
                    photoInputArea.innerHTML = `<img src="${currentPhoto}" alt="Preview"><p style="color:#64748b;margin-top:0.5rem;font-size:0.8rem;">Tap to change</p>`;
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        // ===== Save =====
        document.getElementById('save-btn').addEventListener('click', async () => {
            const date = document.getElementById('entry-date').value;
            if (!date) { showToast('Please select a date'); return; }

            const entry = { date };
            let hasValue = false;
            MEASUREMENTS.forEach(m => {
                const val = parseFloat(document.getElementById(m.id).value);
                if (!isNaN(val)) { entry[m.id] = val; hasValue = true; }
            });

            if (!hasValue) { showToast('Enter at least one measurement'); return; }

            if (currentPhoto) {
                entry.photo = currentPhoto;
            }

            await saveEntry(entry);
            showToast('Week saved ✓');

            // Clear form
            MEASUREMENTS.forEach(m => document.getElementById(m.id).value = '');
            currentPhoto = null;
            photoInputArea.innerHTML = '<p style="color:#64748b;">Tap to add a photo</p>';
            photoInput.value = '';
        });

        // ===== Dashboard =====
        async function renderDashboard() {
            const entries = await getAllEntries();
            const container = document.getElementById('dashboard-grid');

            if (entries.length === 0) {
                container.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><p>No entries yet. Log your first week to see your dashboard.</p></div>';
                return;
            }

            const first = entries[0];
            const latest = entries[entries.length - 1];
            const weeks = entries.length;

            const currentWeight = latest.weight !== undefined ? latest.weight : '—';
            const startWeight = first.weight !== undefined ? first.weight : null;
            const totalGain = (startWeight !== null && latest.weight !== undefined)
                ? (latest.weight - startWeight).toFixed(1)
                : '—';
            const totalGainSign = totalGain !== '—' && parseFloat(totalGain) >= 0 ? '+' : '';

            container.innerHTML = `
                <div class="dash-card">
                    <div class="value">${currentWeight}</div>
                    <div class="label">Current Weight (lbs)</div>
                </div>
                <div class="dash-card">
                    <div class="value">${totalGainSign}${totalGain}</div>
                    <div class="label">Total Weight Change (lbs)</div>
                </div>
                <div class="dash-card">
                    <div class="value">${weeks}</div>
                    <div class="label">Weeks Tracked</div>
                </div>
                <div class="dash-card">
                    <div class="value">${formatDate(first.date).split(',')[0]}</div>
                    <div class="label">Started</div>
                </div>
            `;
        }
        renderDashboard();

        // ===== History =====
        async function renderHistory() {
            const container = document.getElementById('history-container');
            const entries = await getAllEntries();

            if (entries.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No entries yet. Log your first week!</p></div>';
                return;
            }

            const first = entries[0];

            container.innerHTML = entries.slice().reverse().map((e, revIdx) => {
                const idx = entries.length - 1 - revIdx;
                const prev = idx > 0 ? entries[idx - 1] : null;

                const measurements = MEASUREMENTS
                    .filter(m => e[m.id] !== undefined)
                    .map(m => {
                        const weekDelta = prev ? formatDelta(e[m.id], prev[m.id]) : '';
                        const totalDelta = (first[m.id] !== undefined && idx > 0) ? formatDelta(e[m.id], first[m.id]) : '';
                        let deltaStr = '';
                        if (weekDelta) deltaStr += `wk: ${weekDelta}`;
                        if (totalDelta) deltaStr += ` tot: ${totalDelta}`;
                        return `<span>${m.label}: <strong>${e[m.id]} ${m.unit}</strong> ${deltaStr}</span>`;
                    })
                    .join('');

                const photoHtml = e.photo ? `<div class="history-photo"><img src="${e.photo}" alt="Progress photo" onclick="showPhotoModal('${e.date}')"></div>` : '';

                return `
                    <div class="history-card">
                        <div class="history-card-header">
                            <span class="history-date">${formatDate(e.date)}</span>
                            <button class="btn-danger" onclick="deleteEntryUI('${e.date}')">Delete</button>
                        </div>
                        <div class="history-measurements">${measurements}</div>
                        ${photoHtml}
                    </div>`;
            }).join('');
        }

        window.deleteEntryUI = async function(date) {
            if (confirm('Delete this entry?')) {
                await deleteEntry(date);
                renderHistory();
                showToast('Entry deleted');
            }
        };

        window.showPhotoModal = async function(date) {
            const entries = await getAllEntries();
            const entry = entries.find(e => e.date === date);
            if (entry && entry.photo) {
                document.getElementById('modal-img').src = entry.photo;
                document.getElementById('photo-modal').classList.add('show');
            }
        };

        document.getElementById('photo-modal').addEventListener('click', () => {
            document.getElementById('photo-modal').classList.remove('show');
        });

        // ===== Photo Gallery =====
        async function renderPhotoGallery() {
            const entries = await getAllEntries();
            const withPhotos = entries.filter(e => e.photo);
            const container = document.getElementById('photo-gallery');

            if (withPhotos.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No photos yet. Add one with your next entry.</p></div>';
                return;
            }

            container.innerHTML = withPhotos.slice().reverse().map(e => `
                <div class="photo-gallery-item" onclick="showPhotoModal('${e.date}')">
                    <img src="${e.photo}" alt="Progress ${e.date}">
                    <div class="photo-date">${formatDate(e.date)}</div>
                </div>
            `).join('');
        }

        // ===== Charts =====
        let chartInstance = null;
        let activeMetric = 'weight';

        function buildChartSelect() {
            const container = document.getElementById('chart-select');
            container.innerHTML = MEASUREMENTS.map(m =>
                `<button data-metric="${m.id}" class="${m.id === activeMetric ? 'active' : ''}">${m.label}</button>`
            ).join('');

            container.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeMetric = btn.dataset.metric;
                    container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderChart();
                });
            });
        }

        async function renderChart() {
            const entries = await getAllEntries();
            const metric = MEASUREMENTS.find(m => m.id === activeMetric);

            const data = entries.filter(e => e[activeMetric] !== undefined);
            const labels = data.map(e => formatDate(e.date));
            const values = data.map(e => e[activeMetric]);

            if (chartInstance) chartInstance.destroy();

            const ctx = document.getElementById('progress-chart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: `${metric.label} (${metric.unit})`,
                        data: values,
                        borderColor: metric.color,
                        backgroundColor: metric.color + '22',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { labels: { color: '#e2e8f0' } }
                    },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                    }
                }
            });
        }

        buildChartSelect();

        // ===== Goals =====
        function buildGoalMetricSelect() {
            const select = document.getElementById('goal-metric');
            select.innerHTML = MEASUREMENTS.map(m =>
                `<option value="${m.id}">${m.label} (${m.unit})</option>`
            ).join('');
        }
        buildGoalMetricSelect();

        document.getElementById('add-goal-btn').addEventListener('click', async () => {
            const metricId = document.getElementById('goal-metric').value;
            const target = parseFloat(document.getElementById('goal-target').value);
            if (isNaN(target)) { showToast('Enter a target value'); return; }

            const entries = await getAllEntries();
            const firstWithMetric = entries.find(e => e[metricId] !== undefined);
            const startValue = firstWithMetric ? firstWithMetric[metricId] : null;

            await saveGoal({ metric: metricId, target, startValue });
            document.getElementById('goal-target').value = '';
            showToast('Goal added ✓');
            renderGoals();
        });

        async function renderGoals() {
            const goals = await getAllGoals();
            const entries = await getAllEntries();
            const container = document.getElementById('goals-container');

            if (goals.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No goals set. Add one above.</p></div>';
                return;
            }

            const latest = entries.length > 0 ? entries[entries.length - 1] : {};

            container.innerHTML = goals.map(g => {
                const metric = MEASUREMENTS.find(m => m.id === g.metric);
                const current = latest[g.metric];
                const start = g.startValue;
                const target = g.target;

                let progressPct = 0;
                let statusText = 'No data yet';
                let isComplete = false;

                if (current !== undefined && start !== null) {
                    const totalNeeded = target - start;
                    const achieved = current - start;
                    if (totalNeeded !== 0) {
                        progressPct = Math.min(100, Math.max(0, (achieved / totalNeeded) * 100));
                    }
                    if ((totalNeeded > 0 && current >= target) || (totalNeeded < 0 && current <= target)) {
                        progressPct = 100;
                        isComplete = true;
                    }
                    statusText = `Current: ${current} ${metric.unit} → Target: ${target} ${metric.unit}`;
                } else if (current !== undefined) {
                    statusText = `Current: ${current} ${metric.unit} → Target: ${target} ${metric.unit}`;
                }

                return `
                    <div class="goal-item">
                        <div class="goal-header">
                            <span class="goal-label">${metric.label} ${isComplete ? '✅' : ''}</span>
                            <button class="btn-danger" onclick="deleteGoalUI(${g.id})">Remove</button>
                        </div>
                        <div class="goal-numbers">${statusText}</div>
                        <div class="progress-bar">
                            <div class="progress-fill ${isComplete ? 'complete' : ''}" style="width:${progressPct}%"></div>
                        </div>
                    </div>`;
            }).join('');
        }

        window.deleteGoalUI = async function(id) {
            if (confirm('Remove this goal?')) {
                await deleteGoal(id);
                renderGoals();
                showToast('Goal removed');
            }
        };

    })();

    // ===== Register Service Worker =====
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
            .then(() => console.log('SW registered'))
            .catch(err => console.log('SW registration failed:', err));
    }
    </script>
</body>
</html>
